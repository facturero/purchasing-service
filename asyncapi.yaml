asyncapi: 2.6.0
info:
  title: purchasing-service — eventos
  version: 1.0.0
  description: >-
    purchasing-service PUBLICA estos eventos en el exchange `crm.events` (patrón Outbox, @facturero/outbox-relay) y CONSUME uno:
    `fiscal.ec.withholding.issued` (ver su canal más abajo). Todo payload lleva `organizationId` y, añadidos por el relay, actor, IP y request-id. Los importes van en centavos de la
    moneda de la orden; las cantidades, como texto (hasta 6 decimales).
channels:
  purchasing.supplier.upserted:
    publish:
      summary: 'Alta o cambio de un proveedor (un solo tipo: quien lo consume guarda el último estado)'
      message:
        payload:
          type: object
          properties:
            supplierId: { type: string, format: uuid }
            identificationType: { type: string, enum: [RUC, CEDULA, PASAPORTE, EXTERIOR] }
            identification: { type: string }
            legalName: { type: string }
            tradeName: { type: string, nullable: true }
            paymentTermDays: { type: integer }
            relatedParty: { type: boolean }
            status: { type: string, enum: [active, inactive] }
            previousStatus: { type: string, description: Solo al activar o desactivar }
  purchasing.order.created:
    publish:
      summary: Se creó un borrador de orden de compra
      message: { $ref: '#/components/messages/Order' }
  purchasing.order.updated:
    publish:
      summary: Se editó un borrador
      message: { $ref: '#/components/messages/Order' }
  purchasing.order.submitted:
    publish:
      summary: El borrador se envió (ya tiene número). `needsApproval` dice si espera a otra persona.
      message: { $ref: '#/components/messages/Order' }
  purchasing.order.approved:
    publish:
      summary: Orden aprobada — el compromiso de compra con el proveedor
      description: >-
        La aprueba otra persona o, si la política de la organización no exigía aprobación para ese monto, queda aprobada al enviarse
        (`approvedByPolicy: true`, sin `approvedBy`). Lleva las líneas para quien deba prever la entrada de mercadería o el compromiso
        de gasto.
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/OrderPayload'
            - type: object
              properties:
                approvedBy: { type: string, format: uuid, nullable: true }
                approvedAt: { type: string, format: date-time }
                approvedByPolicy: { type: boolean }
                expectedDate: { type: string, format: date, nullable: true }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: string, example: '10.5' }
                      unitCostCents: { type: integer }
                      subtotalCents: { type: integer }
                      taxCents: { type: integer }
  purchasing.order.rejected:
    publish:
      summary: Una persona rechazó la orden (vuelve a borrador al reabrirla)
      message: { $ref: '#/components/messages/Order' }
  purchasing.order.reopened:
    publish:
      summary: Una orden rechazada volvió a borrador
      message: { $ref: '#/components/messages/Order' }
  purchasing.order.cancelled:
    publish:
      summary: Orden cancelada, con motivo
      message: { $ref: '#/components/messages/Order' }
  purchasing.settings.updated:
    publish:
      summary: Cambió la política de aprobación o la bodega por defecto
      message:
        payload:
          type: object
          properties:
            approvalThresholdCents: { type: integer, nullable: true, description: 'null = nunca se pide aprobación' }
            defaultWarehouseId: { type: string, format: uuid, nullable: true }
            overReceiptToleranceBp: { type: integer, description: 'Tolerancia de sobre-recepción en puntos básicos' }

  purchasing.order.received:
    publish:
      summary: Orden de compra recibida en su totalidad (todas las líneas de producto completadas)
      message:
        payload:
          $ref: '#/components/schemas/OrderPayload'

  purchasing.order.closed:
    publish:
      summary: Orden cerrada manualmente (lo pendiente se da por terminado)
      message:
        payload:
          type: object
          properties:
            orderId: { type: string, format: uuid }
            reason: { type: string }

  purchasing.receipt.posted:
    publish:
      summary: Recepción de mercadería registrada (resumen para auditoría y terceros)
      message:
        payload:
          type: object
          properties:
            receiptId: { type: string, format: uuid }
            receiptNumber: { type: string, example: 'RM-2026-000001' }
            orderId: { type: string, format: uuid }
            orderNumber: { type: string, nullable: true }
            supplierId: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            lineCount: { type: integer }
            totalCostCents: { type: integer }

  purchasing.bill.created:
    publish:
      summary: Factura de compra creada (borrador)
      message:
        payload:
          $ref: '#/components/schemas/BillPayload'

  purchasing.bill.updated:
    publish:
      summary: Factura de compra actualizada (borrador)
      message:
        payload:
          $ref: '#/components/schemas/BillPayload'

  purchasing.bill.posted:
    publish:
      summary: Factura de compra contabilizada (evento de negocio para accounting)
      message:
        payload:
          $ref: '#/components/schemas/BillPayload'

  purchasing.bill.blocked:
    publish:
      summary: Factura bloqueada por conciliación a tres vías
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/BillPayload'
            - type: object
              properties:
                matchReasons: { type: array, items: { type: object } }

  purchasing.bill.overridden:
    publish:
      summary: Factura aprobada con excepción (override por otra persona)
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/BillPayload'
            - type: object
              properties:
                overrideReason: { type: string }
                overrideBy: { type: string, format: uuid }

  purchasing.bill.voided:
    publish:
      summary: Factura de compra anulada
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/BillPayload'
            - type: object
              properties:
                voidReason: { type: string }

  purchasing.bill.withholding_issued:
    publish:
      summary: Una retención autorizada cita esta factura de compra (la factura pasa a withholdingStatus = issued)
      description: >-
        Se publica cuando purchasing consume `fiscal.ec.withholding.issued` y encuentra la factura CONTABILIZADA que la retención cita
        (por RUC del proveedor y número del documento sustento). La factura no guarda el id del comprobante: aquí queda el rastro.
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/BillPayload'
            - type: object
              properties:
                withholdingDocumentId: { type: string, description: 'Id de la retención en fiscal-ecuador (`withholdingId` del evento consumido)' }
                withholdingNumber: { type: string, nullable: true, example: 001-001-000000007 }
                withholdingAuthorization: { type: string, nullable: true, description: Número de autorización del SRI }

  fiscal.ec.withholding.issued:
    subscribe:
      summary: CONSUMIDO — una retención emitida por fiscal-ecuador quedó autorizada por el SRI
      description: >-
        Lo publica fiscal-ecuador (no este servicio). NO trae ningún id de factura de compra: fiscal no sabe que existe este módulo.
        Purchasing busca la factura por `supplier.identification` + `support.documentCode` + `support.number` (000-000-000000000,
        establecimiento-punto-secuencial) dentro de la organización. Si no hay factura, o no está contabilizada, o ya tiene retención,
        el mensaje se IGNORA sin fallar (casi todas las retenciones son de compras que no pasaron por este módulo). Idempotente.
      message:
        payload:
          type: object
          required: [organizationId, withholdingId]
          properties:
            organizationId: { type: string, format: uuid }
            withholdingId: { type: string, description: Id de la retención en fiscal-ecuador }
            number: { type: string, example: 001-001-000000007, description: Número del comprobante de retención }
            authorizationNumber: { type: string, nullable: true }
            supplier:
              type: object
              properties:
                identification: { type: string }
                businessName: { type: string }
            support:
              type: object
              properties:
                documentCode: { type: string, example: '01', description: 'Solo 01, 03 y 41 pueden ser una factura de compra' }
                number: { type: string, example: 001-002-000000123 }
                issueDate: { type: string, format: date }

  purchase.purchase_order.received:
    publish:
      summary: 'Contrato con inventory-service: mercadería recibida, entra a stock con el costo de la orden'
      message:
        payload:
          type: object
          properties:
            purchaseOrderId: { type: string, format: uuid }
            organizationId: { type: string, format: uuid }
            warehouseId: { type: string, format: uuid }
            receiptId: { type: string, format: uuid }
            receiptNumber: { type: string }
            lines:
              type: array
              items:
                type: object
                properties:
                  productId: { type: string, format: uuid }
                  quantity: { type: string }
                  unitCostCents: { type: integer }
                  currencyCode: { type: string }
components:
  messages:
    Order:
      payload:
        $ref: '#/components/schemas/OrderPayload'
    Bill:
      payload:
        $ref: '#/components/schemas/BillPayload'

  schemas:
    OrderPayload:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        number: { type: string, nullable: true, example: OC-2026-000042 }
        status: { type: string }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        warehouseId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid, nullable: true }
        currencyCode: { type: string, example: USD }
        orderDate: { type: string, format: date }
        subtotalCents: { type: integer }
        taxCents: { type: integer }
        totalCents: { type: integer }
        lineCount: { type: integer }
        createdBy: { type: string, format: uuid }
        rejectionReason: { type: string, description: Solo en `rejected` }
        cancelReason: { type: string, description: Solo en `cancelled` }
        needsApproval: { type: boolean, description: Solo en `submitted` }

    BillPayload:
      type: object
      properties:
        billId: { type: string, format: uuid }
        internalNumber: { type: string, nullable: true, example: FC-2026-000001 }
        supplierId: { type: string, format: uuid }
        supplier: { type: object, properties: { identification: { type: string }, legalName: { type: string } } }
        docType: { type: string, example: '01' }
        supplierDocument: { type: string, example: '001-001-000000123' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currencyCode: { type: string, example: USD }
        subtotalCents: { type: integer }
        taxCents: { type: integer }
        totalCents: { type: integer }
        establishmentId: { type: string, format: uuid, nullable: true }
        orderId: { type: string, format: uuid, nullable: true }
        matchStatus: { type: string, enum: [matched, blocked, overridden, not_applicable] }
        lines:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [stock, expense] }
              productId: { type: string, format: uuid, nullable: true }
              expenseAccountHint: { type: string, nullable: true }
              subtotalCents: { type: integer }
              vatCents: { type: integer }
              iceCents: { type: integer }
              irbpnrCents: { type: integer }
              priceVarianceCents: { type: integer }
